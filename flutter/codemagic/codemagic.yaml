workflows:
  android-release:
    name: Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.x
      java: 17
      groups:
        - google_play_credentials
        - android_signing
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Set up keystore
        script: echo $CM_KEYSTORE | base64 --decode > android/app/release.keystore
      - name: Install dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build AAB
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  flutter-test:
    name: Flutter Test
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.x
    triggering:
      events:
        - pull_request
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --fatal-infos
      - name: Format check
        script: dart format --set-exit-if-changed .
      - name: Test with coverage
        script: flutter test --coverage
    artifacts:
      - coverage/
